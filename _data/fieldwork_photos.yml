# Fieldwork gallery on /fieldwork, shown in this order.
#
# Adding photos:
# 1. Put the original photos in _fieldwork-originals/ (that folder is never published or committed).
# 2. They get resized, stripped of all metadata (including GPS), and saved in assets/images/fieldwork/ as
#    fieldwork-NN.jpg (enlarged view) plus fieldwork-NN-small.jpg (gallery row).
# 3. Write a one-line caption and a short description (alt) of what the photo shows for screen reader users.
# Until a photo file exists, its slot shows a "Photo coming soon" tile.
#
# Everyone photographed consented (communities, children, enumerators, and survey respondents signed waivers).
# Photos showing children's faces are left out on purpose (13 SurveyResponse3 and 16 ConsentedSelfie were removed in October 2026).

