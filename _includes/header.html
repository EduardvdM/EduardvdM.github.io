<header id="header">

	<!-- IMAGE AND TITLE -->
	<div id="head" class="parallax{% if page.url != '/' %} head--compact{% endif %}">
		<h1 id="logo" class="text-center">
			<a class="title" href="/">{{ site.title }}</a>
		</h1>
		<p class="tagline text-center">{{ site.tagline }}<br>{{ site.institution }}</p>
	</div>

	<!-- NAVIGATION BAR -->
	<nav class="navbar navbar-default" aria-label="Main">
		<div class="container-fluid">
			<div class="navbar-collapse">
				<ul class="nav navbar-nav">
					{%- for item in site.data.navigation %}
					{%- if page.url == item.url %}
					<li class="active"><a href="{{ item.url }}" aria-current="page">{{ item.title | escape }}</a></li>
					{%- else %}
					<li><a href="{{ item.url }}">{{ item.title | escape }}</a></li>
					{%- endif %}
					{%- endfor %}
				</ul>
			</div>
		</div>
	</nav>

</header>
